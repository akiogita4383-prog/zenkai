<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>前回いつ</title>
<meta name="description" content="薬やコンタクトなど、前回いつやったかをカレンダーにすぐ記録できるアプリ">
<meta name="theme-color" content="#EEF2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171D" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="前回いつ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column, phone-first. Item cards (the "pills") on top, month calendar below, bottom sheet for editing. */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#18232E; --muted:#5E6E7C; --line:#D6DEE4;
  --accent:#2C6E9E; --accent-soft:#DCE9F3; --warn:#C2410C; --warn-soft:#FCE7DC; --ok:#2F7D5B;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171D; --surface:#19232C; --ink:#E6EDF2; --muted:#93A3B1; --line:#2B3843;
  --accent:#6FB0E0; --accent-soft:#1E3344; --warn:#F28B5B; --warn-soft:#3A2419; --ok:#6CC59B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171D; --surface:#19232C; --ink:#E6EDF2; --muted:#93A3B1; --line:#2B3843;
  --accent:#6FB0E0; --accent-soft:#1E3344; --warn:#F28B5B; --warn-soft:#3A2419; --ok:#6CC59B; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 96px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.02em}
.today{color:var(--muted);font-size:.85rem}

.sample{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.85rem}
.sample button{border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}

/* Item cards */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.card.active{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.card .top{display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.card .edit{border:0;background:none;color:var(--muted);padding:2px 4px;font-size:1rem;line-height:1}
.ago{font-family:var(--font-display);font-size:1.5rem;font-weight:700;line-height:1.1}
.ago small{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:2px}
.last{font-size:.78rem;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;align-self:flex-start}
.chip.due{background:var(--warn-soft);color:var(--warn)}
.chip.next{background:var(--bg);color:var(--muted)}
.card .actions{display:flex;gap:6px;margin-top:2px}
.btn-today{flex:1;border:0;border-radius:10px;padding:8px 6px;background:var(--c);color:#fff;font-weight:700;font-size:.85rem}
.btn-today.done{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.btn-pen{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 9px;font-size:.78rem;color:var(--muted)}
.add-card{border:1.5px dashed var(--line);background:transparent;border-radius:16px;color:var(--muted);font-weight:700;min-height:64px}

/* Pen banner */
.pen{display:flex;align-items:center;gap:10px;justify-content:space-between;border-radius:12px;padding:9px 12px;background:var(--c);color:#fff;font-size:.88rem;font-weight:500}
.pen button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem}

/* Calendar */
.cal{background:var(--surface);border-radius:20px;padding:14px 10px 12px;border:1px solid var(--line)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cal-head h2{font-family:var(--font-display);font-size:1.15rem;margin:0}
.cal-head .nav{display:flex;gap:4px}
.cal-head .nav button{border:0;background:var(--bg);border-radius:10px;min-width:36px;height:34px;font-weight:700}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow span{text-align:center;font-size:.7rem;color:var(--muted);letter-spacing:.08em;padding-bottom:4px}
.dow span:first-child{color:var(--warn)} .dow span:last-child{color:var(--accent)}
.day{aspect-ratio:1/1.08;max-width:100%;border:0;background:transparent;border-radius:12px;padding:5px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.day:hover{background:var(--bg)}
.day .d{font-family:var(--font-num);font-size:.82rem;line-height:1.2}
.day.out{opacity:.32}
.day.sun .d{color:var(--warn)} .day.sat .d{color:var(--accent)}
.day.is-today{background:var(--accent-soft)}
.day.is-today .d{font-weight:700}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dots i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dots em{font-style:normal;font-size:.6rem;color:var(--muted);line-height:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--muted);padding:10px 6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.legend i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,16,22,.42);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:85%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font-family:var(--font-display);font-size:1.2rem;margin:0 0 12px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:transparent;text-align:left;width:100%}
.row.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.row .name{flex:1;font-weight:700}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none}
.row.on .check{background:var(--c);border-color:var(--c)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.form{display:flex;flex-direction:column;gap:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:0;background:var(--c)}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:.8rem}
.hint{font-size:.75rem;color:var(--muted)}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.primary{flex:1;border:0;background:var(--accent);color:var(--surface);border-radius:12px;padding:12px;font-weight:700}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:12px 14px;font-weight:700;color:var(--muted)}
.danger{border:0;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:700}
.confirm{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-size:.85rem;display:flex;flex-direction:column;gap:10px}
.confirm div{display:flex;gap:8px}
.history{display:flex;flex-wrap:wrap;gap:6px}
.history span{font-family:var(--font-num);font-size:.75rem;background:var(--bg);border-radius:8px;padding:3px 8px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>前回いつ</h1>
    <span class="today" id="todayLabel"></span>
  </header>
  <div class="sample" id="sampleBar" hidden>
    <span>表示中の項目と記録はサンプルです</span>
    <button id="clearSample" type="button">消して始める</button>
  </div>
  <section class="items" id="items" aria-label="項目"></section>
  <div class="pen" id="penBar" hidden></div>
  <section class="cal" aria-label="カレンダー">
    <div class="cal-head">
      <h2 id="monthLabel"></h2>
      <div class="nav">
        <button type="button" id="prev" aria-label="前の月">‹</button>
        <button type="button" id="thisMonth">今月</button>
        <button type="button" id="next" aria-label="次の月">›</button>
      </div>
    </div>
    <div class="dow"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i></i>記録した日</span><span><i class="ring"></i>次回の目安</span><span>日付をタップで記録・取消</span></div>
  </section>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const KEY='zenkai-itsu-v1';
const COLORS=['#2F8F83','#3B6FD8','#E0674F','#D99A1E','#8B5CB8','#5A9A3C','#D14D8A','#5B6B7A'];
const WD='日月火水木金土';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

const TODAY=key(new Date());
let view=new Date(); view.setDate(1);
let pen=null, toastTimer=null, undoFn=null;

function sample(){
  const t=new Date(), k=n=>key(addDays(t,-n));
  return {sample:true,items:[
    {id:'s1',name:'コンタクト',color:COLORS[1],interval:14},
    {id:'s2',name:'花粉症の薬',color:COLORS[0],interval:1},
    {id:'s3',name:'頭痛薬',color:COLORS[2],interval:0},
    {id:'s4',name:'目薬（ボトル交換）',color:COLORS[4],interval:30}
  ],logs:{s1:[k(30),k(16),k(2)],s2:[k(5),k(4),k(3),k(2),k(1)],s3:[k(19),k(9)],s4:[k(34)]}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.items))S=sample();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const logs=id=>(S.logs[id]||(S.logs[id]=[]));
function lastOf(id){const l=logs(id).filter(d=>d<=TODAY).sort();return l[l.length-1]||null}
function nextOf(it){const l=lastOf(it.id);return (l&&it.interval>0)?key(addDays(parse(l),it.interval)):null}
const has=(id,d)=>logs(id).includes(d);
function toggle(id,d,silent){
  const l=logs(id),i=l.indexOf(d),it=S.items.find(x=>x.id===id);
  if(i>=0)l.splice(i,1);else{l.push(d);l.sort()}
  save();render();
  if(!silent){
    const on=i<0;
    toast((on?'記録しました：':'取り消しました：')+it.name+' '+md(d),()=>toggle(id,d,true));
  }
}

function render(){
  const t=parse(TODAY);
  $('todayLabel').textContent='今日 '+(t.getMonth()+1)+'月'+t.getDate()+'日（'+WD[t.getDay()]+'）';
  $('sampleBar').hidden=!S.sample;
  // cards
  let h='';
  S.items.forEach(it=>{
    const l=lastOf(it.id), n=nextOf(it), done=has(it.id,TODAY);
    let agoTxt='—', sub='まだ記録がありません';
    if(l){const a=diff(TODAY,l);agoTxt=a===0?'今日':a+'<small>日前</small>';sub='前回 '+md(l)}
    let chip='',bar='';
    if(n){
      const left=diff(n,TODAY), el=diff(TODAY,l);
      chip=left<0?'<span class="chip due">'+(-left)+'日超過</span>':left===0?'<span class="chip due">今日が目安</span>':'<span class="chip next">あと'+left+'日（'+n.slice(5).replace('-','/').replace(/^0/,'').replace('/0','/')+'）</span>';
      bar='<div class="bar"><i style="width:'+Math.min(100,Math.round(el/it.interval*100))+'%"></i></div>';
    }
    h+='<div class="card'+(pen===it.id?' active':'')+'" style="--c:'+it.color+'">'+
      '<div class="top"><span class="dot"></span><button class="name" type="button" data-hist="'+it.id+'">'+esc(it.name)+'</button><button class="edit" type="button" data-edit="'+it.id+'" aria-label="'+esc(it.name)+'を編集">⋯</button></div>'+
      '<div class="ago">'+agoTxt+'</div><div class="last">'+sub+'</div>'+bar+chip+
      '<div class="actions"><button type="button" class="btn-today'+(done?' done':'')+'" data-today="'+it.id+'">'+(done?'✓ 今日記録済':'今日やった')+'</button>'+
      '<button type="button" class="btn-pen" data-pen="'+it.id+'" aria-label="カレンダーで'+esc(it.name)+'を記録">'+(pen===it.id?'完了':'日付')+'</button></div></div>';
  });
  h+='<button type="button" class="add-card" id="addItem">＋ 項目を追加</button>';
  $('items').innerHTML=h;
  // pen bar
  const pi=S.items.find(x=>x.id===pen);
  if(pi){$('penBar').hidden=false;$('penBar').style.setProperty('--c',pi.color);$('penBar').innerHTML='<span>「'+esc(pi.name)+'」の日付をタップして記録</span><button type="button" id="penOff">完了</button>'}
  else $('penBar').hidden=true;
  // calendar
  $('monthLabel').textContent=view.getFullYear()+'年 '+(view.getMonth()+1)+'月';
  const start=addDays(view,-view.getDay());
  const nexts={};S.items.forEach(it=>{const n=nextOf(it);if(n)(nexts[n]=nexts[n]||[]).push(it)});
  let g='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i),k=key(d);
    if(i===35&&d.getMonth()!==view.getMonth())break;
    const recs=S.items.filter(it=>has(it.id,k)&&(!pen||true));
    let dots='';
    const shown=recs.slice(0,4);
    shown.forEach(it=>dots+='<i style="--c:'+it.color+'"></i>');
    if(recs.length>4)dots+='<em>+'+(recs.length-4)+'</em>';
    (nexts[k]||[]).forEach(it=>{if(!has(it.id,k))dots+='<i class="ring" style="--c:'+it.color+'"></i>'});
    const cls=['day',d.getMonth()!==view.getMonth()?'out':'',d.getDay()===0?'sun':'',d.getDay()===6?'sat':'',k===TODAY?'is-today':''].join(' ');
    const names=recs.map(r=>r.name).join('、');
    g+='<button type="button" class="'+cls+'" data-day="'+k+'" aria-label="'+(d.getMonth()+1)+'月'+d.getDate()+'日'+(names?' 記録：'+esc(names):'')+'"><span class="d">'+d.getDate()+'</span><span class="dots">'+dots+'</span></button>';
  }
  $('grid').innerHTML=g;
}

/* sheet */
function openSheet(html){$('sheet').innerHTML=html;$('sheet').hidden=false;$('backdrop').hidden=false}
function closeSheet(){$('sheet').hidden=true;$('backdrop').hidden=true}
$('backdrop').onclick=closeSheet;

function daySheet(k){
  const d=parse(k);
  const rows=S.items.map(it=>'<button type="button" class="row'+(has(it.id,k)?' on':'')+'" style="--c:'+it.color+'" data-dtog="'+it.id+'" data-d="'+k+'"><span class="check">✓</span><span class="name">'+esc(it.name)+'</span></button>').join('');
  openSheet('<h3>'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）</h3><div class="rows">'+(rows||'<p class="hint">先に項目を追加してください</p>')+'</div><div class="sheet-actions"><button type="button" class="primary" data-close>閉じる</button></div>');
}
function histSheet(id){
  const it=S.items.find(x=>x.id===id);const l=[...logs(id)].sort().reverse();
  openSheet('<h3 style="color:'+it.color+'">'+esc(it.name)+'の記録</h3><p class="hint">'+l.length+'回'+(it.interval?' ・ '+it.interval+'日ごとが目安':'')+'</p><div class="history">'+(l.map(s=>'<span>'+s.replace(/-/g,'/')+'</span>').join('')||'<span>なし</span>')+'</div><div class="sheet-actions"><button type="button" class="primary" data-close>閉じる</button></div>');
}
let draft=null;
function editSheet(id){
  const it=id?S.items.find(x=>x.id===id):null;
  draft={id:it?it.id:null,color:it?it.color:COLORS[S.items.length%COLORS.length]};
  const presets=[['コンタクト',14],['薬',1],['目薬',0],['歯ブラシ',30],['フィルター',90]];
  openSheet('<h3>'+(it?'項目を編集':'項目を追加')+'</h3><form class="form" id="itemForm">'+
    '<label class="f">名前<input type="text" id="fName" maxlength="20" required value="'+(it?esc(it.name):'')+'" placeholder="例：コンタクト、ビタミン剤"></label>'+
    (it?'':'<div class="presets">'+presets.map(p=>'<button type="button" data-preset="'+p[0]+'|'+p[1]+'">'+p[0]+'</button>').join('')+'</div>')+
    '<label class="f">交換・服用の間隔（日）<input type="number" id="fInt" min="0" max="999" inputmode="numeric" value="'+(it?it.interval||'':'')+'" placeholder="空欄なら目安なし"></label>'+
    '<span class="hint">2weekコンタクトなら14、毎日の薬なら1。次回の目安と超過日数が出ます。</span>'+
    '<div class="f">色<div class="swatches">'+COLORS.map(c=>'<button type="button" class="sw'+(c===draft.color?' on':'')+'" style="--c:'+c+'" data-sw="'+c+'" aria-label="色"></button>').join('')+'</div></div>'+
    '<div id="confirmBox"></div>'+
    '<div class="sheet-actions">'+(it?'<button type="button" class="danger" id="delBtn">削除</button>':'')+'<button type="button" class="ghost" data-close>やめる</button><button type="submit" class="primary">保存</button></div></form>');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const ds=b.dataset;
  if(ds.today){toggle(ds.today,TODAY)}
  else if(ds.pen){pen=pen===ds.pen?null:ds.pen;render()}
  else if(b.id==='penOff'){pen=null;render()}
  else if(ds.edit){editSheet(ds.edit)}
  else if(ds.hist){histSheet(ds.hist)}
  else if(b.id==='addItem'){editSheet(null)}
  else if(ds.day){if(pen)toggle(pen,ds.day);else daySheet(ds.day)}
  else if(ds.dtog){toggle(ds.dtog,ds.d,true);daySheet(ds.d)}
  else if(ds.close!==undefined){closeSheet()}
  else if(ds.sw){draft.color=ds.sw;document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.sw===ds.sw))}
  else if(ds.preset){const[n,i]=ds.preset.split('|');$('fName').value=n;$('fInt').value=i>0?i:''}
  else if(b.id==='delBtn'){
    const it=S.items.find(x=>x.id===draft.id);
    $('confirmBox').innerHTML='<div class="confirm">「'+esc(it.name)+'」と記録'+logs(it.id).length+'件を削除します。<div><button type="button" class="danger" id="delYes" style="background:var(--warn);color:var(--surface)">削除する</button><button type="button" class="ghost" id="delNo">残す</button></div></div>';
  }
  else if(b.id==='delNo'){$('confirmBox').innerHTML=''}
  else if(b.id==='delYes'){
    const idx=S.items.findIndex(x=>x.id===draft.id),it=S.items[idx],l=S.logs[it.id];
    S.items.splice(idx,1);delete S.logs[it.id];if(pen===it.id)pen=null;save();closeSheet();render();
    toast('削除しました：'+it.name,()=>{S.items.splice(idx,0,it);S.logs[it.id]=l;save();render()});
  }
  else if(b.id==='prev'){view.setMonth(view.getMonth()-1);render()}
  else if(b.id==='next'){view.setMonth(view.getMonth()+1);render()}
  else if(b.id==='thisMonth'){view=new Date();view.setDate(1);render()}
  else if(b.id==='clearSample'){S={items:[],logs:{}};pen=null;save();render();editSheet(null)}
  else if(b===$('toast').querySelector('button')&&undoFn){const f=undoFn;hideToast();f()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='itemForm')return;e.preventDefault();
  const name=$('fName').value.trim();if(!name){$('fName').focus();return}
  const iv=Math.max(0,parseInt($('fInt').value,10)||0);
  if(draft.id){Object.assign(S.items.find(x=>x.id===draft.id),{name,interval:iv,color:draft.color})}
  else{const id=uid();S.items.push({id,name,interval:iv,color:draft.color});S.logs[id]=[]}
  save();closeSheet();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function toast(msg,undo){
  undoFn=undo;const t=$('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button">元に戻す</button>':'');
  t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,4000);
}
function hideToast(){$('toast').hidden=true;undoFn=null}

render();
// 日付が変わったら「今日」を更新
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&key(new Date())!==TODAY)location.reload()});
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>

</body>
</html>
